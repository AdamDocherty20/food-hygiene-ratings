name: Sync FSA data

# Runs the FSA CSV import (scripts/sync.ts) on a schedule so published ratings don't go
# stale. Host-agnostic on purpose — this runs from GitHub Actions rather than the
# deployment platform, so it works the same way regardless of where the app itself is
# hosted (Vercel, Railway, etc.). Requires a DATABASE_URL secret pointed at the same
# Postgres database the app uses (see README "Deploying").
on:
  schedule:
    # 03:00 UTC daily — the FSA source data doesn't update more often than that, and an
    # off-peak hour keeps this well clear of any real traffic.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
