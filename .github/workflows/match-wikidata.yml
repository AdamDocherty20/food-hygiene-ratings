name: Match Wikidata

# Runs scripts/match-wikidata.ts on a schedule to keep the "Part of the [chain] chain" facts
# current. Chain data (foundings, websites) changes rarely, so monthly is a conservative
# cadence rather than a necessary one. Requires a DATABASE_URL secret pointed at the same
# Postgres database the app uses (see README "Deploying") — same secret the FSA sync
# (sync.yml) already uses.
on:
  schedule:
    # 04:00 UTC on the 2nd of the month — an hour after the Companies House match, just to
    # keep the two runs' logs from interleaving; they don't share any resources.
    - cron: "0 4 2 * *"
  workflow_dispatch: {}

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run match:wikidata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
